<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-labelledby="title desc">
<title id="title">BlockWise Cyprus</title>
<desc id="desc">BlockWise Cyprus logo with buildings and yacht</desc>

<!-- compact icon -->
<g transform="translate(2 3)">
  <circle cx="33" cy="33" r="30" fill="#ffffff" stroke="#16324a" stroke-width="3"/>
  <path d="M33 3 A30 30 0 0 1 63 33 A30 30 0 0 1 33 63"
        fill="none" stroke="#2f8b7a" stroke-width="3"/>

  <!-- buildings -->
  <rect x="15" y="19" width="13" height="27" rx="2" fill="#16324a"/>
  <rect x="31" y="11" width="15" height="35" rx="2" fill="#2f8b7a"/>
  <g fill="#ffffff">
    <rect x="19" y="24" width="4" height="4" rx=".7"/>
    <rect x="19" y="32" width="4" height="4" rx=".7"/>
    <rect x="35" y="17" width="4" height="4" rx=".7"/>
    <rect x="35" y="25" width="4" height="4" rx=".7"/>
    <rect x="35" y="33" width="4" height="4" rx=".7"/>
  </g>

  <!-- yacht, simplified for small sizes -->
  <path d="M12 44 C19 40 28 38 39 38 H52 L57 42 L52 47 H24 C19 47 15 46 12 44Z"
        fill="#16324a"/>
  <path d="M26 38 L34 32 H43 L48 38Z"
        fill="#ffffff" stroke="#16324a" stroke-width="2"/>
  <path d="M11 51 C20 48 29 48 37 51 C45 54 52 54 59 50"
        fill="none" stroke="#2f8b7a" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- wordmark -->
<text x="76" y="36" font-family="Arial, Helvetica, sans-serif"
      font-size="29" font-weight="700" fill="#16324a">BlockWise</text>

<!-- Cyprus -->
<line x1="78" y1="52" x2="101" y2="52" stroke="#16324a" stroke-width="1.7"/>
<text x="109" y="57" font-family="Arial, Helvetica, sans-serif"
      font-size="13" font-weight="700" letter-spacing="4.1" fill="#2f8b7a">CYPRUS</text>
<line x1="211" y1="52" x2="234" y2="52" stroke="#16324a" stroke-width="1.7"/>
</svg>
