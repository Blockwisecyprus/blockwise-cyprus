<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 76" role="img" aria-labelledby="title desc">
  <title id="title">BlockWise Cyprus</title>
  <desc id="desc">BlockWise Cyprus logo with buildings, yacht and waves</desc>

  <!-- Icon -->
  <g transform="translate(3 3)">
    <circle cx="35" cy="35" r="32" fill="#ffffff" stroke="#16324a" stroke-width="2.2"/>
    <path d="M35 3 A32 32 0 0 1 67 35 A32 32 0 0 1 35 67" fill="none" stroke="#2f8b7a" stroke-width="2.2"/>

    <!-- buildings -->
    <rect x="17" y="19" width="14" height="27" rx="2.5" fill="#16324a"/>
    <rect x="34" y="11" width="16" height="35" rx="2.5" fill="#2f8b7a"/>
    <g fill="#ffffff">
      <rect x="21" y="24" width="3.2" height="3.2" rx=".6"/>
      <rect x="26" y="24" width="3.2" height="3.2" rx=".6"/>
      <rect x="21" y="31" width="3.2" height="3.2" rx=".6"/>
      <rect x="26" y="31" width="3.2" height="3.2" rx=".6"/>
      <rect x="38" y="18" width="3.2" height="3.2" rx=".6"/>
      <rect x="44" y="18" width="3.2" height="3.2" rx=".6"/>
      <rect x="38" y="25" width="3.2" height="3.2" rx=".6"/>
      <rect x="44" y="25" width="3.2" height="3.2" rx=".6"/>
      <rect x="38" y="32" width="3.2" height="3.2" rx=".6"/>
      <rect x="44" y="32" width="3.2" height="3.2" rx=".6"/>
    </g>

    <!-- yacht -->
    <path d="M13 45 C20 41, 28 39, 37 39 L54 39 L59 42 L54 48 L25 49 C20 49,16 48,13 45Z" fill="#16324a"/>
    <path d="M27 39 L35 34 L44 34 L48 39 Z" fill="#ffffff" stroke="#16324a" stroke-width="1.5"/>
    <path d="M31 34 L37 30 L42 30 L45 34 Z" fill="#ffffff" stroke="#16324a" stroke-width="1.5"/>
    <path d="M12 51 C22 48, 28 48, 36 51 C44 54, 50 54, 59 50" fill="none" stroke="#2f8b7a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M16 55 C25 52, 31 53, 38 55 C45 57, 51 57, 57 54" fill="none" stroke="#2f8b7a" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="82" y="38" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#16324a">BlockWise</text>
  <line x1="84" y1="52" x2="112" y2="52" stroke="#16324a" stroke-width="1.5"/>
  <text x="119" y="57" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="6" fill="#2f8b7a">CYPRUS</text>
  <line x1="241" y1="52" x2="269" y2="52" stroke="#16324a" stroke-width="1.5"/>
</svg>
