<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" role="img" aria-labelledby="title desc">
<title id="title">BlockWise Cyprus</title>
<desc id="desc">BlockWise Cyprus logo with buildings, yacht and waves</desc>

<!-- emblem -->
<g transform="translate(4 5)">
  <circle cx="45" cy="45" r="41" fill="#ffffff" stroke="#12324d" stroke-width="3.2"/>
  <path d="M45 4 A41 41 0 0 1 86 45 A41 41 0 0 1 45 86"
        fill="none" stroke="#2f8f7b" stroke-width="3.2"/>

  <!-- buildings -->
  <rect x="23" y="28" width="17" height="34" rx="3" fill="#12324d"/>
  <rect x="44" y="17" width="20" height="45" rx="3" fill="#2f8f7b"/>
  <g fill="#ffffff">
    <rect x="28" y="34" width="5" height="5" rx="1"/>
    <rect x="28" y="45" width="5" height="5" rx="1"/>
    <rect x="49" y="25" width="5" height="5" rx="1"/>
    <rect x="49" y="36" width="5" height="5" rx="1"/>
    <rect x="49" y="47" width="5" height="5" rx="1"/>
  </g>

  <!-- yacht -->
  <path d="M18 61 C27 56 38 53 50 53 H69 L76 58 L69 65 H33 C27 65 22 64 18 61Z"
        fill="#12324d"/>
  <path d="M38 53 L48 45 H60 L66 53Z"
        fill="#ffffff" stroke="#12324d" stroke-width="2.3"/>
  <path d="M17 72 C29 68 39 68 50 71 C60 75 69 75 80 70"
        fill="none" stroke="#2f8f7b" stroke-width="3.5" stroke-linecap="round"/>
</g>

<!-- wordmark -->
<text x="100" y="48"
      font-family="Arial, Helvetica, sans-serif"
      font-size="39" font-weight="700" fill="#12324d">BlockWise</text>

<line x1="103" y1="68" x2="126" y2="68" stroke="#12324d" stroke-width="1.8"/>
<text x="136" y="74"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15" font-weight="700" letter-spacing="5.2" fill="#2f8f7b">CYPRUS</text>
<line x1="259" y1="68" x2="282" y2="68" stroke="#12324d" stroke-width="1.8"/>
</svg>
